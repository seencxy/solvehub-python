[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solvehub"
version = "0.1.0"
description = "Python client for the SolveHub CAPTCHA API - one REST endpoint for authorized anti-bot testing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "seencxy" }]
keywords = ["captcha", "turnstile", "datadome", "perimeterx", "scraping", "anti-bot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://www.tiam.codes"
Source = "https://github.com/seencxy/solvehub-python"

[tool.setuptools]
packages = ["solvehub"]
